<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz khám phá FedEx</title>
<style>
:root{--purple:#4d148c;--orange:#ff6200;--ink:#241537}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f1fa;color:var(--ink);line-height:1.6}header{background:var(--purple);color:white;text-align:center;padding:30px 20px;border-bottom:6px solid var(--orange)}header h1{margin:0;font-size:clamp(24px,5vw,36px)}header p{margin:8px 0 0}main{max-width:850px;margin:24px auto;padding:0 16px 35px}.card{background:white;padding:clamp(20px,4vw,36px);border-radius:20px;box-shadow:0 8px 28px #4d148c12}.meta{display:flex;justify-content:space-between;gap:10px;font-weight:bold;color:var(--purple)}progress{width:100%;height:12px;accent-color:var(--orange);margin:16px 0}h2{font-size:clamp(20px,4vw,27px);line-height:1.4}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{display:flex;align-items:center;gap:14px;text-align:left;background:#faf8fd;border:2px solid #e4d9ef;border-radius:14px;padding:18px;cursor:pointer;font:inherit;color:var(--ink);min-height:100px}.answer:hover:not(:disabled){border-color:var(--purple);background:#f1e8fb}.answer:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.icon{font-size:40px;min-width:54px;text-align:center}.answer.correct{background:#eaf8ef;border-color:#20864a}.answer.wrong{background:#fff0ef;border-color:#c43b36}.answer:disabled{cursor:default;opacity:1;color:var(--ink)}.feedback{margin-top:22px;padding:20px;border-radius:14px;background:#f5effc;border-left:5px solid var(--purple)}.feedback p{margin:8px 0}.action{background:var(--purple);color:white;border:0;border-radius:10px;padding:14px 24px;font:inherit;font-weight:bold;cursor:pointer;margin-top:20px}.action:hover{background:#381065}.result{text-align:center}.score{font-size:64px;font-weight:bold;color:var(--purple);margin:10px}.note{font-size:12px;color:#6b6274;margin:18px 4px}.hidden{display:none!important}@media(max-width:560px){.answers{grid-template-columns:1fr}.answer{min-height:80px;padding:14px}.icon{font-size:34px}}
</style>
</head>
<body>
<header><h1>Khám phá FedEx</h1><p>3 câu hỏi thú vị • Chọn đáp án để xem giải thích</p></header>
<main><section class="card" id="quiz" aria-label="Bài trắc nghiệm">
<div class="meta"><span id="counter"></span><span id="points"></span></div>
<progress id="progress" max="3" value="0" aria-label="Số câu đã trả lời"></progress>
<h2 id="question"></h2><div class="answers" id="answers"></div>
<div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div>
<button id="next" class="action hidden" type="button">Câu tiếp theo →</button>
</section>
<section id="result" class="card result hidden" aria-live="polite"><h2>Hoàn thành bài quiz! 🎉</h2><div id="finalScore" class="score"></div><p id="message"></p><button id="restart" class="action" type="button">Chơi lại</button></section>
<p class="note">Nội dung câu hỏi, đáp án và giải thích được giữ theo thông tin bạn cung cấp. Hình minh họa sử dụng emoji, không cần tải ảnh hoặc kết nối Internet. Bài quiz không thu thập thông tin người chơi.</p>
</main>
<script>
// Nội dung theo thông tin người dùng cung cấp, chưa xác minh độc lập.
const questions = [
 {question:'Loài động vật “đặc biệt” nào FedEx đã từng vận chuyển?',answers:[{text:'Gấu trúc',icon:'🐼'},{text:'Hổ Bengal',icon:'🐯'},{text:'Cá sấu',icon:'🐊'},{text:'Tất cả các đáp án trên',icon:'🐼 🐯 🐊'}],correct:3,explanation:'<p>Ngoài hàng triệu kiện hàng mỗi ngày, FedEx còn vận chuyển nhiều loài động vật đặc biệt trên thế giới, từ gấu trúc phục vụ các chương trình bảo tồn, hổ Bengal cho các sở thú, đến cả cá sấu và nhiều loài động vật hoang dã khác dưới quy trình vận chuyển chuyên biệt.</p>'},
 {question:'FedEx hiện là đối tác chính thức của môn thể thao nào sau đây?',answers:[{text:'UEFA Champions League',icon:'⚽'},{text:'NFL',icon:'🏈'},{text:'PGA TOUR',icon:'⛳'},{text:'Tất cả các đáp án trên',icon:'🏆'}],correct:3,explanation:'<p><strong>FedExCup (PGA TOUR Golf)</strong><br>FedEx là nhà tài trợ đặt tên cho FedExCup từ năm 2007. Đây là giải đấu/nội dung tài trợ nổi tiếng nhất của FedEx.</p><p><strong>NFL (National Football League)</strong><br>FedEx là Official Delivery Service Sponsor của NFL, Super Bowl và Pro Bowl. Chương trình “FedEx Air &amp; Ground Players of the Week” rất nổi tiếng tại Mỹ.</p><p><strong>UEFA Champions League</strong><br>FedEx là đối tác chính thức của giải đấu bóng đá cấp CLB danh giá nhất châu Âu.</p>'},
 {question:'FedEx giao hơn bao nhiêu kiện hàng mỗi ngày trên toàn cầu?',answers:[{text:'Khoảng 1 triệu kiện',icon:'📦'},{text:'Khoảng 5 triệu kiện',icon:'🚚'},{text:'Khoảng 17 triệu kiện',icon:'✈️'},{text:'Hơn 50 triệu kiện',icon:'🌍'}],correct:2,explanation:'<p>Mỗi ngày, mạng lưới FedEx vận chuyển trung bình khoảng 17 triệu kiện hàng và tài liệu trên toàn thế giới.</p>'}
];
let current=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function render(){
 answered=false;const q=questions[current];
 $('counter').textContent=`Câu ${current+1} / ${questions.length}`;
 $('points').textContent=`Điểm: ${score}`;
 $('progress').value=current;
 $('question').textContent=q.question;
 $('feedback').classList.add('hidden');$('next').classList.add('hidden');
 $('answers').replaceChildren();
 q.answers.forEach((a,i)=>{
 const b=document.createElement('button');b.type='button';b.className='answer';
 const icon=document.createElement('span');icon.className='icon';icon.setAttribute('aria-hidden','true');icon.textContent=a.icon;
 const label=document.createElement('span');label.textContent=`${'ABCD'[i]}. ${a.text}`;
 b.append(icon,label);b.addEventListener('click',()=>select(i));$('answers').append(b);
 });
}
function select(index){
 if(answered)return;answered=true;const q=questions[current];const correct=index===q.correct;
 if(correct)score++;
 Array.from($('answers').children).forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');else if(i===index)b.classList.add('wrong');});
 $('points').textContent=`Điểm: ${score}`;$('progress').value=current+1;
 $('feedback').innerHTML=`<strong>${correct?'✅ Chính xác!':'❌ Chưa chính xác.'} Đáp án: ${'ABCD'[q.correct]}. ${q.answers[q.correct].text}</strong>${q.explanation}`;
 $('feedback').classList.remove('hidden');$('next').textContent=current===questions.length-1?'Xem kết quả →':'Câu tiếp theo →';$('next').classList.remove('hidden');$('next').focus();
}
$('next').addEventListener('click',()=>{
 if(!answered)return;
 if(current<questions.length-1){current++;render();$('answers').firstElementChild.focus();}
 else{$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=`${score} / ${questions.length}`;$('message').textContent=score===3?'Tuyệt vời! Bạn đã trả lời đúng cả 3 câu.':`Bạn đã trả lời đúng ${score} câu. Chơi lại để khám phá thêm nhé!`;$('restart').focus();}
});
$('restart').addEventListener('click',()=>{current=0;score=0;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();$('answers').firstElementChild.focus();});
render();
</script>
</body>
</html>
